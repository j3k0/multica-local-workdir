# devbox3 (FOV-2442). Install: /etc/systemd/system/user@1000.service.d/oom.conf
# Default is OOMScoreAdjust=100 for the user manager, and its services get
# manager+100 = 200. On a 32 GB RAM + 16 GB swap host, +100 weighs like ~4.8 GB of
# RSS, so on 2026-10-30 the kernel OOM-killed the 1.7 MB user manager before
# 1.5 GB test processes, taking every user service down for 97 min.
# -100 makes the manager a last resort and puts its services at 0, the same as
# docker and system services.
[Service]
OOMScoreAdjust=-100
